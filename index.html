<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix Intro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      font-family: Arial, sans-serif;
    }

    /* Start / Interaction Screen */
    #start-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: pointer;
    }

    .enter-btn {
      padding: 16px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      background-color: #e50914; /* Netflix Red */
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .enter-btn:hover {
      background-color: #f40612;
      transform: scale(1.05);
    }

    /* Fullscreen Intro Video */
    #intro-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      display: none; /* Hidden until clicked */
    }

    /* Skip button */
    .skip-btn {
      position: absolute;
      bottom: 30px;
      right: 30px;
      padding: 10px 24px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      z-index: 10;
      display: none;
      transition: all 0.3s ease;
    }

    .skip-btn:hover {
      background: #e50914;
      border-color: #e50914;
    }
  </style>
</head>
<body>

  <!-- Screen to capture user click for unmuted audio -->
  <div id="start-screen" onclick="startIntro()">
    <button class="enter-btn">Click to Enter</button>
  </div>

  <!-- Intro Video -->
  <video id="intro-video" playsinline>
    <source src="vidssave.com Netflix Intro 1080p (Highest Quality) 1080p.mp4" type="video/mp4" />
    Your browser does not support HTML5 video.
  </video>

  <button id="skip-btn" class="skip-btn" onclick="redirectToOption()">Skip</button>

  <script>
    // Exact destination file name:
    const nextPage = "option.html"; 

    const video = document.getElementById("intro-video");
    const startScreen = document.getElementById("start-screen");
    const skipBtn = document.getElementById("skip-btn");

    function startIntro() {
      // Hide the initial splash screen
      startScreen.style.display = "none";
      video.style.display = "block";
      skipBtn.style.display = "block";

      // Explicitly keep unmuted and start playback
      video.muted = false;
      video.volume = 1.0;
      video.play();
    }

    function redirectToOption() {
      window.location.href = nextPage;
    }

    // Auto-redirect as soon as the Netflix intro video finishes playing
    video.addEventListener("ended", redirectToOption);
  </script>

</body>
</html>
